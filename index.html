<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KutApp.io | Get Lost</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #ffffff; }
        .glitch { text-shadow: 2px 0 #ff00c1, -2px 0 #00fff9; }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-screen p-6 md:p-12 overflow-hidden">

    <header class="w-full flex justify-between items-center">
        <div class="font-black text-2xl tracking-tighter">KUTAPP<span class="text-pink-600">.IO</span></div>
        <div class="text-xs uppercase tracking-widest text-gray-500">Dismissals: <span id="counter" class="text-white">0</span></div>
    </header>

    <main class="text-center flex flex-col items-center max-w-2xl">
        <div id="language-indicator" class="text-xs uppercase font-bold text-pink-600 mb-4 tracking-widest">System Ready</div>
        
        <h1 id="message" class="text-5xl md:text-8xl font-black mb-6 uppercase italic leading-none transition-all duration-300">
            GO AWAY.
        </h1>
        
        <p id="subtext" class="text-gray-400 text-lg md:text-xl font-medium max-w-md">
            (This is your first and only polite warning.)
        </p>
    </main>

    <footer class="w-full max-w-md flex flex-col gap-6">
        
        <div class="flex flex-col gap-2">
            <label class="text-[10px] uppercase text-gray-600 font-bold text-center">Select Rejection Dialect</label>
            <select id="langSelect" class="bg-gray-900 border border-gray-800 text-white p-3 rounded-lg text-sm focus:outline-none focus:border-pink-600 transition-colors">
                <option value="random">Randomized Chaos</option>
                <option value="dutch">Dutch (Traditional)</option>
                <option value="english">English (Blunt)</option>
                <option value="passive">Corporate Passive-Aggressive</option>
            </select>
        </div>

        <div class="flex flex-col gap-3">
            <button onclick="window.location.href='https://google.com'" class="w-full bg-white text-black font-black py-5 rounded-xl hover:bg-gray-200 transition-all uppercase tracking-tight">
                I'll Leave Now
            </button>
            <button onclick="handleRejection()" class="w-full border border-gray-800 text-gray-400 py-4 rounded-xl hover:text-white hover:border-gray-600 transition-all text-sm font-bold">
                Keep Going
            </button>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // These are found in your Supabase Project Settings > API
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPack = 1; // Default to Dutch Pack

    // Function to fetch a random phrase from the database
    async function handleRejection() {
        // 1. Get a random phrase from the selected pack
        const { data, error } = await supabase
            .from('phrases')
            .select('*')
            .eq('pack_id', currentPack);

        if (data && data.length > 0) {
            const randomPick = data[Math.floor(Math.random() * data.length)];
            
            // 2. Update the UI
            document.getElementById('message').innerText = randomPick.content;
            document.getElementById('subtext').innerText = `(${randomPick.translation})`;
            
            // 3. Local counter for gamification
            updateLocalCounter();
        }
    }

    function updateLocalCounter() {
        let count = parseInt(document.getElementById('counter').innerText);
        count++;
        document.getElementById('counter').innerText = count;
        
        // Trigger screen shake on milestones
        if (count % 10 === 0) {
            document.body.classList.add('shake');
            setTimeout(() => document.body.classList.remove('shake'), 500);
        }
    }
</script>
</body>
</html>
