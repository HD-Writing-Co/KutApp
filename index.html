<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KutApp | Emotional Damage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #ffffff; overflow: hidden; margin: 0; }
        .sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(100%); z-index: 100; }
        .sidebar.open { transform: translateX(0); }
        .central-modal { 
            position: fixed; top: 10%; left: 50%; transform: translateX(-50%) scale(0.9);
            width: 95%; max-width: 400px; background: #0a0a0a; border: 1px solid #222;
            border-radius: 24px; z-index: 60; display: none; padding: 24px; max-height: 85vh; overflow-y: auto; opacity: 0; transition: all 0.2s ease;
        }
        .central-modal.active { display: block; opacity: 1; transform: translateX(-50%) scale(1); }
        .vibe-toggle { display: flex; background: #111; padding: 4px; border-radius: 50px; border: 1px solid #222; margin-bottom: 20px; }
        .vibe-btn { padding: 8px 20px; border-radius: 50px; font-size: 10px; font-weight: 900; text-transform: uppercase; transition: all 0.2s; cursor: pointer; color: #666; }
        .vibe-btn.active-roast { background: #db2777; color: white; }
        .vibe-btn.active-toast { background: #fbbf24; color: black; }
        .pack-card { background: #111; border: 1px solid #222; padding: 12px; border-radius: 12px; cursor: pointer; margin-bottom: 8px; transition: all 0.2s; }
        .pack-card.active { border-color: #db2777; background: #1a0a10; transform: scale(1.02); }
        #subtext:empty { display: none; }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-screen p-6 md:p-12 relative pt-16">

    <header class="w-full flex justify-between items-center max-w-5xl z-10">
        <div class="font-black text-2xl tracking-tighter uppercase italic">KUTAPP</div>
        <div class="flex items-center gap-3">
            <button onclick="openModal('leaderboard-modal'); fetchLeaderboard();" class="bg-gray-900/50 p-3 rounded-xl border border-gray-800">🏆</button>
            <button onclick="openModal('shop-modal')" class="bg-gray-900/50 p-3 rounded-xl border border-gray-800">🛒</button>
            <button onclick="toggleSidebar()" class="bg-gray-900 p-3 rounded-xl border border-gray-800">☰</button>
        </div>
    </header>

    <main class="w-full flex-grow flex flex-col justify-center items-center px-6 text-center">
        <div class="vibe-toggle">
            <button id="roastMode" onclick="setMode('roast')" class="vibe-btn active-roast">🔥 Roast</button>
            <button id="toastMode" onclick="setMode('toast')" class="vibe-btn">✨ Toast</button>
        </div>
        <div id="message-container">
            <h1 id="message" class="text-4xl md:text-6xl font-black mb-4 uppercase italic">READY?</h1>
            <p id="subtext" class="text-gray-500 text-sm mb-8 h-6 italic uppercase font-bold tracking-widest"></p>
        </div>
    </main>

    <footer class="w-full max-w-sm flex flex-col gap-4 mb-10">
        <div class="flex justify-between items-end px-2">
            <div><p id="counter" class="text-3xl font-black">0</p><p class="text-[9px] uppercase font-bold text-gray-600">Impacts</p></div>
            <div class="text-right">
                <p id="aura-text" class="text-xl font-black text-pink-600">--/--</p>
                <div class="w-24 h-1.5 bg-gray-900 rounded-full mt-1 overflow-hidden">
                    <div id="aura-progress" class="bg-pink-600 h-full" style="width: 0%"></div>
                </div>
            </div>
        </div>
        <button id="actionBtn" onclick="triggerAction()" class="w-full bg-white text-black font-black py-6 rounded-2xl uppercase shadow-2xl transition-all active:scale-95">Get Roasted</button>
    </footer>

    <div id="shop-modal" class="central-modal">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black uppercase italic text-yellow-500">Shop</h2>
            <div class="text-[10px] font-bold text-gray-500">Aura: <span id="shop-aura-display" class="text-white">--</span></div>
            <button onclick="closeAllModals()" class="text-gray-500 text-xs">✕</button>
        </div>
        <div class="space-y-3">
            <button onclick="buyAura('extension', 50, 'https://buy.stripe.com/8x2bJ0chU5oa4jr4pTgbm01')" class="w-full bg-[#111] border border-blue-900/30 p-4 rounded-xl flex justify-between items-center hover:bg-blue-500/5 transition-all">
                <div class="text-left"><p class="text-[10px] font-black text-blue-500 uppercase">Aura Extension (Sm)</p><p class="text-xs font-black text-white">REFILL LIMIT 50</p></div>
                <span class="text-[10px] font-black bg-blue-600 text-white px-3 py-1 rounded-full">$1.99</span>
            </button>
            <button onclick="buyAura('extension', 100, 'https://buy.stripe.com/14A4gy2Hkg2O4jr7C5gbm02')" class="w-full bg-[#111] border border-purple-900/30 p-4 rounded-xl flex justify-between items-center hover:bg-purple-500/5 transition-all">
                <div class="text-left"><p class="text-[10px] font-black text-purple-500 uppercase">Aura Extension (Lg)</p><p class="text-xs font-black text-white">REFILL LIMIT 100</p></div>
                <span class="text-[10px] font-black bg-purple-600 text-white px-3 py-1 rounded-full">$4.99</span>
            </button>
            <button onclick="buyAura('pack', 10, 'https://buy.stripe.com/cNi8wObdQg2O6rz3lPgbm03')" class="w-full bg-[#111] border border-gray-700 p-4 rounded-xl flex justify-between items-center hover:bg-white/5 transition-all">
                <div class="text-left"><p class="text-[10px] font-black text-gray-400 uppercase">Aura Refill (Sm)</p><p class="text-xs font-black text-white">+10 AURA INSTANT</p></div>
                <span class="text-[10px] font-black bg-gray-700 text-white px-3 py-1 rounded-full">$0.99</span>
            </button>
            <button onclick="buyAura('pack', 100, 'https://buy.stripe.com/8x23cu4Ps3g2bLT09Dgbm00')" class="w-full bg-[#111] border border-yellow-900/30 p-4 rounded-xl flex justify-between items-center hover:bg-yellow-500/5 transition-all">
                <div class="text-left"><p class="text-[10px] font-black text-yellow-500 uppercase">Aura Refill (Lg)</p><p class="text-xs font-black text-white">+100 AURA INSTANT</p></div>
                <span class="text-[10px] font-black bg-yellow-600 text-black px-3 py-1 rounded-full">$2.99</span>
            </button>
            <button onclick="buyAura('unlock', 69, 'https://buy.stripe.com/00w6oGfu617UeY5bSlgbm04')" class="w-full bg-[#1a0a10] border border-pink-900/40 p-4 rounded-xl flex justify-between items-center hover:bg-pink-500/10 transition-all">
                <div class="text-left"><p class="text-[10px] font-black text-pink-500 uppercase">Special Unlock</p><p class="text-xs font-black text-white">KINK ROULETTE</p></div>
                <span class="text-[10px] font-black bg-pink-600 text-white px-3 py-1 rounded-full">$1.49</span>
            </button>
        </div>
    </div>

    <div id="profile-modal" class="central-modal">
        <div class="flex justify-between items-center mb-6"><h2 class="text-xl font-black uppercase italic text-white">Profile</h2><button onclick="closeAllModals()" class="text-gray-500 text-xs">✕</button></div>
        <div class="flex flex-col items-center gap-4 bg-gray-900 p-6 rounded-xl border border-gray-800 mb-6">
            <div class="relative group">
                <img id="profile-img-modal" src="https://api.dicebear.com/7.x/avataaars/svg?seed=guest" class="w-24 h-24 rounded-full border-2 border-pink-600 object-cover bg-black">
                <label class="absolute inset-0 flex items-center justify-center bg-black/60 rounded-full opacity-0 group-hover:opacity-100 cursor-pointer transition-opacity">
                    <span class="text-[10px] font-black uppercase text-white">Upload</span>
                    <input type="file" id="avatar-upload" class="hidden" accept="image/*" onchange="uploadAvatar(this)">
                </label>
            </div>
            <input type="text" id="username-input" class="bg-black border border-gray-700 text-white p-3 rounded-lg w-full text-center font-bold" placeholder="Username">
            <button onclick="updateProfile()" class="w-full bg-white text-black py-3 rounded-lg font-black uppercase text-xs">Save Changes</button>
        </div>
    </div>

    <div id="leaderboard-modal" class="central-modal">
        <div class="flex justify-between items-center mb-4"><h2 class="text-xl font-black uppercase italic text-pink-600">Leaderboard</h2><button onclick="closeAllModals()" class="text-gray-500 text-xs">✕</button></div>
        <div id="leaderboard-list" class="flex flex-col gap-2"></div>
    </div>

    <aside id="sidebar" class="sidebar fixed top-0 right-0 h-full w-80 bg-[#0a0a0a] border-l border-gray-800 p-6 flex flex-col">
        <button onclick="toggleSidebar()" class="text-gray-500 self-end mb-8 uppercase text-[10px] font-bold">Close ✕</button>
        <div class="flex items-center gap-3 mb-8 cursor-pointer group" onclick="openModal('profile-modal')">
            <img id="sidebar-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=guest" class="w-10 h-10 border border-pink-600 rounded-full object-cover">
            <div class="text-left"><p id="username-display" class="font-bold text-sm text-white group-hover:text-pink-600 transition-colors">Guest</p><p class="text-[8px] uppercase text-gray-500 font-black">View Profile</p></div>
        </div>
        <h3 class="text-[10px] font-black uppercase text-pink-600 mb-4 tracking-widest">Select Pack</h3>
        <div id="pack-list" class="flex flex-col gap-2"></div>
    </aside>

    <div id="overlay" onclick="closeAllModals()" class="fixed inset-0 bg-black/80 hidden z-[45] backdrop-blur-sm"></div>

    <script>
        const SUPABASE_URL = 'https://nhsadjdskqlptaqybbkj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oc2FkamRza3FscHRhcXliYmtqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgwNzQ0NTEsImV4cCI6MjA4MzY1MDQ1MX0.tVhMbNYC3kehbA6WfSakKD_AUNqxVkyaosuRjHHUon4'; 
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let aura = 20;
        let auraSoftLimit = 20; 
        let totalRoasts = 0;
        let totalToasts = 0;
        let currentMode = 'roast';
        let currentLang = 'en-US';
        let activePackId = 2;
        let unlockedPacks = [];

        let packs = [
            { id: 2, name: "Blunt English", lang: "en-US", emoji: "🇺🇸", type: "roast" },
            { id: 1, name: "Rude Dutch", lang: "nl-NL", emoji: "🇳🇱", type: "roast" },
            { id: 5, name: "Spicy Spanish", lang: "es-ES", emoji: "🇪🇸", type: "roast" },
            { id: 10, name: "Main Character Energy", lang: "en-US", emoji: "✨", type: "toast" }
        ];

        function setMode(mode) {
            currentMode = mode;
            activePackId = (mode === 'toast') ? 10 : 2;
            document.getElementById('roastMode').className = `vibe-btn ${mode === 'roast' ? 'active-roast' : ''}`;
            document.getElementById('toastMode').className = `vibe-btn ${mode === 'toast' ? 'active-toast' : ''}`;
            document.getElementById('actionBtn').innerText = mode === 'roast' ? 'Get Roasted' : 'Get Toasted';
            updateStatsUI();
        }

        async function triggerAction() {
            const table = (currentMode === 'roast') ? 'phrases' : 'affirmations';
            if (currentMode === 'roast') {
                if (aura < 1) return openModal('shop-modal');
                aura -= 1; totalRoasts++;
            } else {
                if (aura >= auraSoftLimit) return alert("Aura Full!");
                aura = Math.min(auraSoftLimit, aura + 0.25); totalToasts++;
                confetti({ particleCount: 25, spread: 70, origin: { y: 0.6 }, colors: ['#fbbf24', '#ffffff'] });
            }

            const { data } = await sb.from(table).select('*').eq('pack_id', activePackId);
            if (data && data.length > 0) {
                const item = data[Math.floor(Math.random() * data.length)];
                document.getElementById('message').innerText = item.content;
                document.getElementById('subtext').innerText = item.translation || '';
            }
            updateStatsUI();
            saveToDB();
        }

        function updateStatsUI() {
            document.getElementById('counter').innerText = totalRoasts + totalToasts;
            document.getElementById('aura-text').innerText = `${Math.floor(aura)}/${auraSoftLimit}`;
            document.getElementById('shop-aura-display').innerText = Math.floor(aura);
            document.getElementById('aura-progress').style.width = `${Math.min(100, (aura / auraSoftLimit) * 100)}%`;
            renderPacks();
        }

        function renderPacks() {
            const list = document.getElementById('pack-list');
            list.innerHTML = packs.map(p => {
                const isWrongMode = p.type !== currentMode;
                return `
                    <div ${isWrongMode ? '' : `onclick="activePackId=${p.id}; currentLang='${p.lang}'; updateStatsUI();"`} 
                        class="pack-card ${activePackId === p.id ? 'active' : ''} 
                        ${isWrongMode ? 'opacity-20 grayscale cursor-not-allowed' : 'cursor-pointer'}">
                        <span class="text-[10px] font-black uppercase">${p.emoji} ${p.name}</span>
                    </div>`;
            }).join('');
        }

        async function fetchLeaderboard() {
            const { data } = await sb.from('profiles').select('*').order('total_roasts', { ascending: false }).limit(10);
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = data.map((p, i) => `
                <div class="flex items-center justify-between bg-gray-900/50 p-3 rounded-xl border border-gray-800">
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-black text-gray-500 w-4">#${i+1}</span>
                        <img src="${p.avatar_url || 'https://api.dicebear.com/7.x/avataaars/svg?seed='+p.id}" class="w-8 h-8 rounded-full bg-black">
                        <span class="text-xs font-bold">${p.username || 'Ghost'}</span>
                    </div>
                    <span class="text-xs font-black text-pink-600">${p.total_roasts + (p.total_toasts || 0)}</span>
                </div>
            `).join('');
        }

        async function updateProfile() {
            const newName = document.getElementById('username-input').value;
            if (!newName) return;
            await sb.from('profiles').update({ username: newName }).eq('id', currentUser.id);
            document.getElementById('username-display').innerText = newName;
            closeAllModals();
        }

        async function uploadAvatar(input) {
            const file = input.files[0];
            if (!file) return;
            const fileExt = file.name.split('.').pop();
            const filePath = `${currentUser.id}/avatar.${fileExt}`;
            await sb.storage.from('avatars').upload(filePath, file, { upsert: true });
            const { data: { publicUrl } } = sb.storage.from('avatars').getPublicUrl(filePath);
            await sb.from('profiles').update({ avatar_url: publicUrl }).eq('id', currentUser.id);
            document.getElementById('profile-img-modal').src = publicUrl;
            document.getElementById('sidebar-avatar').src = publicUrl;
        }

        function buyAura(type, value, stripeLink) {
            window.location.href = `${stripeLink}?type=${type}&amt=${value}`;
        }

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            currentUser = session?.user || (await sb.auth.signInAnonymously()).data.user;
            const { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
            
            if (profile) {
                aura = profile.aura_balance ?? 20;
                auraSoftLimit = profile.aura_soft_limit ?? 20;
                totalRoasts = profile.total_roasts || 0;
                totalToasts = profile.total_toasts || 0;
                unlockedPacks = profile.unlocked_packs || [];
                document.getElementById('username-display').innerText = profile.username || 'Guest';
                if (profile.avatar_url) {
                    document.getElementById('sidebar-avatar').src = profile.avatar_url;
                    document.getElementById('profile-img-modal').src = profile.avatar_url;
                }
                if (unlockedPacks.includes(69) && !packs.some(p => p.id === 69)) {
                    packs.push({ id: 69, name: "Kink Roulette", lang: "en-US", emoji: "😈", type: "roast" });
                }
            }

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('session') === 'success') {
                const type = urlParams.get('type');
                const amt = parseInt(urlParams.get('amt'));
                if (type === 'extension') auraSoftLimit = amt;
                else if (type === 'pack') aura += amt;
                else if (type === 'unlock') {
                    if (!unlockedPacks.includes(amt)) {
                        unlockedPacks.push(amt);
                        if (amt === 69) packs.push({ id: 69, name: "Kink Roulette", lang: "en-US", emoji: "😈", type: "roast" });
                    }
                }
                await saveToDB();
                window.history.replaceState({}, document.title, window.location.pathname);
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            }
            updateStatsUI();
            setInterval(async () => {
                if (aura < auraSoftLimit) {
                    aura++; await saveToDB(); updateStatsUI();
                }
            }, 300000); 
        }

        async function saveToDB() {
            if (!currentUser) return;
            await sb.from('profiles').update({ 
                aura_balance: aura, 
                aura_soft_limit: auraSoftLimit,
                total_roasts: totalRoasts, 
                total_toasts: totalToasts,
                unlocked_packs: unlockedPacks
            }).eq('id', currentUser.id);
        }

        window.openModal = (id) => { closeAllModals(); document.getElementById(id).classList.add('active'); document.getElementById('overlay').classList.remove('hidden'); };
        window.closeAllModals = () => { document.querySelectorAll('.central-modal').forEach(m => m.classList.remove('active')); document.getElementById('overlay').classList.add('hidden'); document.getElementById('sidebar').classList.remove('open'); };
        window.toggleSidebar = () => { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('hidden'); };

        init();
    </script>
</body>
</html>
