        // 2. NEW selectPack function
        function selectPack(id, lang) {
            const pack = packs.find(p => p.id === id);
            
            // Age Gate for NSFW packs
            if (pack.nsfw && !localStorage.getItem('age_verified')) {
                const confirmed = confirm("🔞 NSFW CONTENT: This pack is intended for adults. It contains spicy, directional bedroom prompts. Are you 18 or older?");

        function setMode(mode) {
			currentMode = mode;
			if (mode === 'toast') {

			document.getElementById('roastMode').className = `vibe-btn ${mode === 'roast' ? 'active-roast' : ''}`;

        async function triggerAction() {
            const table = (currentMode === 'roast') ? 'phrases' : 'affirmations';
            const targetId = (currentMode === 'toast') ? 10 : activePackId;

            if (currentMode === 'roast') {
                if (aura < 1) return openModal('shop-modal');
                aura -= 1; totalRoasts++;
            } else {
                if (aura >= auraSoftLimit) return alert("Aura Full!");
                aura = Math.min(auraSoftLimit + 500, aura + 0.25); totalToasts++;
                confetti({ particleCount: 25, spread: 70, origin: { y: 0.6 }, colors: ['#fbbf24', '#ffffff'] });
            }

            const { data, error } = await sb.from(table).select('*').eq('pack_id', targetId);
            
            if (data && data.length > 0) {
                const item = data[Math.floor(Math.random() * data.length)];
                document.getElementById('message').innerText = item.content;
                document.getElementById('subtext').innerText = item.translation || '';
                document.getElementById('action-row').style.opacity = "1";
            } else {
                document.getElementById('message').innerText = "CONTENT MISSING";

            saveToDB();

        async function updateProfile() {
            const name = document.getElementById('username-input').value;
            if (!currentUser) return;

            if (!error) {
                document.getElementById('username-display').innerText = name;
                alert("Profile Saved!");

        async function uploadAvatar(input) {
            if (!input.files || !input.files[0] || !currentUser) return;
            const file = input.files[0];
            const path = `avatars/${currentUser.id}.png`;
            const { error } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
            if (!error) {
                const { data: { publicUrl } } = sb.storage.from('avatars').getPublicUrl(path);
                await sb.from('profiles').update({ avatar_url: publicUrl }).eq('id', currentUser.id);
                document.getElementById('profile-img-modal').src = publicUrl;
                document.getElementById('sidebar-avatar').src = publicUrl;
            }
        }

        function updateStatsUI() {
			document.getElementById('counter').innerText = totalRoasts + totalToasts;
			const auraDisplay = document.getElementById('aura-text');
			if (aura >= auraSoftLimit) {
				auraDisplay.innerText = Math.floor(aura); 
				auraDisplay.classList.add('text-yellow-500');
				auraDisplay.classList.remove('text-pink-600');
			} else {
				auraDisplay.innerText = `${aura.toFixed(1)}/${auraSoftLimit}`;
				auraDisplay.classList.remove('text-yellow-500');
				auraDisplay.classList.add('text-pink-600');
			}
			document.getElementById('shop-aura-display').innerText = aura.toFixed(1);
			const prog = document.getElementById('aura-progress');
			const percentage = Math.min(100, (aura / auraSoftLimit) * 100);
			prog.style.width = `${percentage}%`;
			if (aura >= auraSoftLimit) {
				prog.style.backgroundColor = '#eab308';
			} else {
				prog.style.backgroundColor = currentMode === 'roast' ? '#db2777' : '#fbbf24';

			document.getElementById('skin-fill').style.width = `${Math.min(100, (totalRoasts/1000)*100)}%`;
			document.getElementById('zen-prog').innerText = `${totalToasts}/500`;
			document.getElementById('zen-fill').style.width = `${Math.min(100, (totalToasts/500)*100)}%`;
			renderPacks();

							${p.emoji} ${p.name} ${isLocked ? '🔒' : ''}

			}).join('');

        function generateShareCard() {
            const canvas = document.getElementById('shareCanvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, 1080, 1080);
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.font = '900 80px Inter';
            const msg = document.getElementById('message').innerText;
            const words = msg.split(' ');
            let line = '', y = 450;
            words.forEach(word => {
                if ((line + word).length > 15) { 
                    ctx.fillText(line.toUpperCase(), 540, y); line = word + ' '; y += 110; 
                } else { line += word + ' '; }
            });
            ctx.fillText(line.toUpperCase(), 540, y);
            ctx.fillStyle = currentMode === 'roast' ? '#db2777' : '#fbbf24';
            ctx.font = 'italic 900 60px Inter';
            ctx.fillText('KUTAPP', 540, 1000);
            const link = document.createElement('a');
            link.download = `KutApp_${currentMode}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

		async function submitSuggestion() {
			const input = document.getElementById('suggest-input');
			const content = input.value.trim();
			const btn = document.getElementById('submit-suggest-btn');
			if (!content || content.length < 5 || isSuggesting) return; 

			isSuggesting = true;
			btn.innerText = "Processing...";
			btn.classList.add('opacity-50', 'cursor-not-allowed');
			const { error } = await sb.from('suggestions').insert([{ content: content, user_id: currentUser.id, status: 'pending' }]);

			if (error) {
				isSuggesting = false;
				btn.innerText = "Submit to Queue";
				btn.classList.remove('opacity-50', 'cursor-not-allowed');
			} else {
				input.value = "";
				btn.innerText = "Submitted!";
				confetti({ particleCount: 20, spread: 50, colors: ['#db2777'] });

					isSuggesting = false;
					btn.innerText = "Submit to Queue";

		function buyAura(type, value, stripeLink) {
			// This appends ?type=unlock&amt=69 to the Stripe URL
			// Stripe will then carry these parameters over to the "Success URL" redirect
			window.location.href = `${stripeLink}?type=${type}&amt=${value}`;
		}

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            currentUser = session?.user || (await sb.auth.signInAnonymously()).data.user;
            const { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
            
            if (profile) {
                aura = profile.aura_balance ?? 20;
                auraSoftLimit = profile.aura_soft_limit ?? 20;
                totalRoasts = profile.total_roasts || 0;
                totalToasts = profile.total_toasts || 0;
                document.getElementById('username-display').innerText = profile.username || "Guest";
                document.getElementById('username-input').value = profile.username || "";
            }

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('session') === 'success') {
                const type = urlParams.get('type');
                const amt = parseInt(urlParams.get('amt'));
				
				if (type === 'unlock') {
					// If the pack isn't already in the array, add it
					if (!unlockedPacks.includes(amt)) {
						unlockedPacks.push(amt);
					}
				}
                if (type === 'extension') {
                    auraSoftLimit = 50; 
                    alert("Upgrade Successful! You now refill up to 50 Aura.");
                } else {
                    aura += amt;
                    alert(`Added ${amt} Aura to your stash!`);
                }
                await saveToDB();
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            updateStatsUI();

            sb.channel('leaderboard-live').on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, 
                () => fetchLeaderboard()
            ).subscribe();

            // Passive Refill: 1 point every 5 mins (300,000ms)
            setInterval(async () => {
                if (aura < auraSoftLimit) {
                    aura++;
                    await saveToDB();
                    updateStatsUI();
                }
            }, 300000);
        }

        async function saveToDB() {
            if (!currentUser) return;
            await sb.from('profiles').update({ 
                aura_balance: aura, 
                aura_soft_limit: auraSoftLimit,
                total_roasts: totalRoasts, 
                total_toasts: totalToasts 
            }).eq('id', currentUser.id);
        }

        window.openModal = (id) => { 
            closeAllModals(); 
            const m = document.getElementById(id);
            if(m) {
                m.classList.add('active'); 
                document.getElementById('overlay').classList.remove('hidden'); 
            }
        };
        window.closeAllModals = () => { 
            document.querySelectorAll('.central-modal').forEach(m => m.classList.remove('active')); 
            document.getElementById('overlay').classList.add('hidden'); 
            document.getElementById('sidebar').classList.remove('open'); 
        };
        window.toggleSidebar = () => { 
            document.getElementById('sidebar').classList.toggle('open'); 
            document.getElementById('overlay').classList.toggle('hidden'); 
        };

        // 4. Updated High-Quality Voice logic
		document.getElementById('speakBtn').onclick = () => {
			window.speechSynthesis.cancel();
			const text = document.getElementById('message').innerText;
			const msg = new SpeechSynthesisUtterance(text);
			msg.lang = currentLang;

        // Prioritize Neural/Premium voices
        const voices = window.speechSynthesis.getVoices();
        const bestVoice = voices.find(v => v.lang.startsWith(currentLang.split('-')[0]) && 
            (v.name.includes('Natural') || v.name.includes('Premium') || v.name.includes('Google'))) 
            || voices.find(v => v.lang.startsWith(currentLang.split('-')[0]));
        
        if (bestVoice) msg.voice = bestVoice;
        msg.pitch = 0.95; 
        msg.rate = 0.9; 
        window.speechSynthesis.speak(msg);
    };
        
        document.getElementById('actionBtn').onclick = triggerAction;
        init();
    </script>
</body>
